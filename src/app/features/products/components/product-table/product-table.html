<div class="product-table__wrapper" (scroll)="closeActions()">
  <table class="product-table">
    <thead class="product-table__head">
      <tr>
        <th scope="col" class="product-table__heading product-table__heading--logo">Logo</th>
        <th scope="col" class="product-table__heading product-table__heading--name">
          Nombre del producto
        </th>
        <th scope="col" class="product-table__heading product-table__heading--description">
          Descripción
        </th>
        <th scope="col" class="product-table__heading product-table__heading--date">
          Fecha de liberación
        </th>
        <th scope="col" class="product-table__heading product-table__heading--date">
          Fecha de reestructuración
        </th>
        <th scope="col" class="product-table__heading">Acciones</th>
      </tr>
    </thead>
    <tbody>
      @for (product of products(); track product.id) {
        <tr class="product-table__row">
          <td class="product-table__cell product-table__cell--logo">
            <img
              class="product-table__logo"
              [src]="product.logo"
              [alt]="product.name"
              width="40"
              height="40"
            />
          </td>
          <td class="product-table__cell product-table__cell--name">{{ product.name }}</td>
          <td class="product-table__cell product-table__cell--description">
            <span class="product-table__description" [title]="product.description">
              {{ product.description }}
            </span>
          </td>
          <td class="product-table__cell product-table__cell--date">
            {{ product.dateRelease | calendarDate }}
          </td>
          <td class="product-table__cell product-table__cell--date">
            {{ product.dateRevision | calendarDate }}
          </td>

          <td class="product-table__cell product-table__cell--actions">
            <div class="product-table__actions">
              <button
                #trigger
                type="button"
                class="product-table__menu-trigger"
                [attr.popovertarget]="'product-actions-' + product.id"
                [attr.aria-label]="'Acciones de ' + product.name"
                aria-expanded="false"
                (click)="toggleActions($event, actions)"
              >
                <span aria-hidden="true">⋮</span>
              </button>
              <div
                #actions
                popover="auto"
                [id]="'product-actions-' + product.id"
                class="product-table__dropdown"
                role="group"
                [attr.aria-label]="'Acciones de ' + product.name"
                (toggle)="onActionsToggle($event, trigger)"
              >
                <a
                  autofocus
                  class="product-table__action product-table__action--edit"
                  [routerLink]="['/products/update', product.id]"
                  [attr.aria-label]="'Editar ' + product.name"
                  (click)="actions.hidePopover()"
                >
                  Editar
                </a>
                <button
                  type="button"
                  class="product-table__action product-table__action--delete"
                  (click)="actions.hidePopover(); trigger.focus(); deleteProduct.emit(product)"
                  [attr.aria-label]="'Eliminar ' + product.name"
                >
                  Eliminar
                </button>
              </div>
            </div>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
