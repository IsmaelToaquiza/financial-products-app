<section class="products-page">
  <div class="products-toolbar">
    <input
      type="search"
      class="products-toolbar__search"
      placeholder="Search..."
      aria-label="Buscar productos"
      [value]="searchTerm()"
      (input)="onSearchInput($event)"
    />

    <a routerLink="/products/create" class="products-toolbar__add-button"> Agregar </a>
  </div>

  <div class="products-card">
    @if (loading()) {
      <app-loading-skeleton />
    } @else if (error()) {
      <div class="products-error">
        <app-feedback-message [message]="error()" type="error" />

        <button type="button" (click)="loadProducts()">Reintentar</button>
      </div>
    } @else {
      @if (filteredProducts().length === 0) {
        <app-feedback-message
          class="products-empty"
          message="No se encontraron productos."
          type="info"
        />
      } @else {
        <app-product-table
          [products]="visibleProducts()"
          (deleteProduct)="selectForDeletion($event)"
        />
      }

      <footer class="products-footer">
        <span class="products-footer__count"> {{ filteredProducts().length }} Resultados </span>

        <div class="products-footer__controls">
          <select
            aria-label="Cantidad de registros"
            id="pageSize"
            class="products-footer__page-size"
            [value]="pageSize()"
            (change)="onPageSizeChange($event)"
          >
            <option value="5">5</option>
            <option value="10">10</option>
            <option value="20">20</option>
          </select>
        </div>
      </footer>
    }
  </div>
</section>

@if (selectedProduct(); as product) {
  <app-delete-dialog
    [product]="product"
    [busy]="deleting()"
    [error]="deleteError()"
    (confirmed)="confirmDeletion()"
    (cancelled)="cancelDeletion()"
  />
}
